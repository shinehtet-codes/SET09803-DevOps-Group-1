name: DevOps Group 1 CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Start MySQL before running database-dependent tests.
      - name: Start MySQL Database
        run: docker compose up -d db

      # Wait until MySQL is ready to accept connections.
      - name: Wait for MySQL
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T db mysqladmin ping \
              -h 127.0.0.1 -uroot -pexample --silent; then
              echo "MySQL is ready."
              exit 0
            fi

            echo "Waiting for MySQL ($attempt/60)..."
            sleep 2
          done

          echo "MySQL did not become ready in time."
          docker compose logs db
          exit 1

      # Run automated tests and package the application.
      - name: Run Tests and Build with Maven
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:33060/world?allowPublicKeyRetrieval=true&useSSL=false
          TEST_DB_USER: root
          TEST_DB_PASSWORD: example
        run: mvn clean package

      - name: Build Docker Images
        run: docker compose build

      # Keep the existing application smoke test.
      - name: Run Application Smoke Test
        run: |
          set -o pipefail
          printf '0\n' | timeout 180s docker compose run --rm -T app | tee app-output.log

          grep -q "Successfully connected to the world database." app-output.log
          grep -q "Thank you for using the application. Goodbye!" app-output.log

      # Clean up even if a previous step fails.
      - name: Stop Docker Containers
        if: always()
        run: docker compose down -v