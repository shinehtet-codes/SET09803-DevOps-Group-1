name: Bug report
description: Report something in the reporting system that does not work as expected.
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in every required field so the team can reproduce it.

  - type: dropdown
    id: report
    attributes:
      label: Affected report
      description: Which user story or part of the application is affected?
      options:
        - US-01 to US-06 (Country reports)
        - US-07 to US-14, US-31, US-32 (City reports)
        - US-15 to US-20 (Capital city reports)
        - US-21 to US-29 (Population reports)
        - US-30 (Language report)
        - Menu / input handling
        - Database connection
        - Build / Docker / GitHub Actions
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear, short description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Menu choices and inputs, in order.
      placeholder: |
        1. Run `docker compose run --rm app`
        2. Select category 2 (City Reports)
        3. Select report 5 (Cities in a District)
        4. Enter district: California
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste the console output or error message.
      render: text
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "High - application crashes or report gives wrong data"
        - "Medium - report works but with incorrect formatting or ordering"
        - "Low - cosmetic or documentation issue"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or branch
      description: Release tag (e.g. v0.2.0) or branch name.
      placeholder: develop
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker version, how the app was run.
    validations:
      required: false